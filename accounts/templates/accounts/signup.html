{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Sign up</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>
	<main class="login-page">
		<section class="login-card" aria-labelledby="signup-title">
			<h1 id="signup-title">Create your account</h1>
			<p class="login-subtitle">Sign up to get started</p>

			<form method="POST" class="login-form" action="">
				{% csrf_token %}

				<div class="form-field">
					<label for="username">Username</label>
					<input id="username" type="text" name="username" placeholder="Choose a username" autocomplete="username" required>
				</div>

				<div class="form-field">
					<label for="password">Password</label>
					<input id="password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
				</div>

				<div class="form-field">
					<label for="password-confirm">Confirm password</label>
					<input id="password-confirm" type="password" name="password_confirm" placeholder="Enter your password again" autocomplete="new-password" required>
				</div>

				<button type="submit">Sign up</button>
			</form>
		</section>
	</main>
</body>
</html>

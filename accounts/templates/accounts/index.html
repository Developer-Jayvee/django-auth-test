{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Welcome back</h1>
            <p class="login-subtitle">Log in to your account</p>

            <form method="POST" class="login-form" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="form-field">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit">Login</button>
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: #f8fafc;
			color: #172033;
			font-family: Arial, sans-serif;
		}

		.top-nav {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 68px;
			padding: 0 32px;
			border-bottom: 1px solid #e2e8f0;
			background: #fff;
		}

		.home-link {
			color: #334155;
			font-weight: 600;
			text-decoration: none;
		}

		.home-link:hover {
			color: #4f46e5;
		}

		.logout-button {
			padding: 9px 16px;
			border: 0;
			border-radius: 8px;
			background: #4f46e5;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		.logout-button:hover {
			background: #4338ca;
		}

		@media (max-width: 480px) {
			.top-nav {
				padding: 0 20px;
			}
		}
	</style>
</head>
<body>
	<nav class="top-nav" aria-label="Main navigation">
		<a class="home-link" href="/">Home</a>
		<button class="logout-button" type="button">Log out</button>
	</nav>

	<main aria-label="Profile content"></main>
</body>
</html>
